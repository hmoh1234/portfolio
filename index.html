<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Halima's Hub | TechBoston Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-black: #050505;
      --surface: rgba(255, 255, 255, 0.035);
      --surface-hover: rgba(255, 255, 255, 0.07);
      --border: rgba(255, 255, 255, 0.1);
      --text-main: #ffffff;
      --text-muted: #9ca3af;
      --magenta: #ff2a85;
      --cyan: #00f0ff;
      --violet: #b026ff;
      --lime: #39ff14;
      --gold: #ffd700;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-black);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      padding-bottom: 4rem;
    }

    /* Ambient Disco Spotlights */
    .disco-bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      overflow: hidden;
      pointer-events: none;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(110px);
      opacity: 0.25;
      animation: floatOrb 18s ease-in-out infinite alternate;
    }

    .orb-1 {
      width: 420px;
      height: 420px;
      background: var(--magenta);
      top: -100px;
      left: -80px;
    }

    .orb-2 {
      width: 380px;
      height: 380px;
      background: var(--cyan);
      bottom: 5%;
      right: -60px;
      animation-delay: -6s;
    }

    .orb-3 {
      width: 320px;
      height: 320px;
      background: var(--violet);
      top: 40%;
      left: 42%;
      opacity: 0.18;
      animation-delay: -11s;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, -35px) scale(1.12); }
    }

    /* Twinkling Disco Sparkles */
    .sparkles {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
    }

    .sparkle {
      position: absolute;
      width: 3px;
      height: 3px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 8px #fff, 0 0 14px var(--cyan);
      animation: twinkle var(--dur, 4s) ease-in-out infinite;
      opacity: 0.2;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.15; transform: scale(0.8); }
      50% { opacity: 0.95; transform: scale(1.4); }
    }

    /* Layout Container */
    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    /* Top Bar */
    header {
      padding: 1.75rem 0 1rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .disco-ball-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffffff, #b4b4b4 45%, #3a3a3a 85%, #111 100%);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.45), 0 0 35px rgba(255, 42, 133, 0.35);
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }

    .disco-ball-icon::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(0,0,0,0.35) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0,0,0,0.35) 1px, transparent 1px);
      background-size: 7px 7px;
      border-radius: 50%;
    }

    .brand-text h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, #ffffff 0%, var(--cyan) 45%, var(--magenta) 85%, var(--gold) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.78rem;
      font-weight: 600;
      color: #e5e7eb;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      margin-top: 0.2rem;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--lime);
      box-shadow: 0 0 8px var(--lime);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      outline: none;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--magenta), var(--violet));
      color: #fff;
      font-weight: 600;
      font-size: 0.9rem;
      padding: 0.65rem 1.2rem;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      box-shadow: 0 4px 20px rgba(255, 42, 133, 0.35);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 26px rgba(255, 42, 133, 0.55);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      border: 1px solid var(--border);
      font-weight: 500;
      font-size: 0.88rem;
      padding: 0.65rem 1.05rem;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--cyan);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
    }

    /* Hero / Welcome & Search Bar */
    .hero {
      padding: 2.25rem 0 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .hero-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-end;
      gap: 1rem;
    }

    .greeting h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .greeting p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 0.3rem;
    }
